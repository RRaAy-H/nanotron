checkpoints:
  checkpoints_path: checkpoints/smolvlm2_infini_test
  checkpoint_interval: 25
  resume_checkpoint_path: null

data_stages:
  - name: "multimodal_training_test"
    start_training_step: 1
    data:
      dataset:
        dataset_overwrite_cache: false
        dataset_processing_num_proc_per_process: 1
        hf_dataset_or_datasets: "data/datasets_nanotron/*_nanotron.json"
        hf_dataset_splits: "train"
        text_column_name: "text"
      num_loading_workers: 1
      seed: 42

general:
  project: "smolvlm2_infini_attention_test"
  run: "smolvlm2_test_training"
  seed: 42

logging:
  iteration_step_info_interval: 5
  log_level: "info"

model:
  dtype: bfloat16
  make_vocab_size_divisible_by: 1
  model_config:
    # SmolVLM2 config
    vocab_size: 49152
    hidden_size: 512
    intermediate_size: 1536
    num_hidden_layers: 12
    num_attention_heads: 8
    num_key_value_heads: 4
    max_position_embeddings: 16384
    rope_theta: 10000.0
    rms_norm_eps: 1e-5
    
    # Infini-attention config
    use_infini_attention: true
    segment_length: 512
    
    # Vision config
    image_token_id: 32000

optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 1.0e-5
    lr_decay_steps: 50
    lr_decay_style: cosine
    lr_warmup_steps: 10
    lr_warmup_style: linear
    min_decay_lr: 1.0e-6
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    weight_decay: 0.01

parallelism:
  dp: 1
  pp: 1
  tp: 1

tokenizer:
  tokenizer_name_or_path: "HuggingFaceTB/SmolVLM2-256M-Video-Instruct"

tokens:
  batch_accumulation_per_replica: 4
  micro_batch_size: 1
  sequence_length: 1024
  train_steps: 50
  val_check_interval: 25
